// build.gradle - for root/parent dir i.g. backend

plugins {
    id "java"
    id "io.spring.dependency-management" version "1.1.7"
}

group = "co.wali"
version = "0.0.1-SNAPSHOT"
description = "FieldWise Backend"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

subprojects {
    apply plugin: "java"
    apply plugin: "io.spring.dependency-management"

    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

// Convenience runners
tasks.register("runApi") {
    dependsOn(":apps:api:bootRun")
}
tasks.register("runAudit") {
    dependsOn(":modules:audit:bootRun")
}

tasks.register("runBilling") {
    dependsOn(":modules:billing:bootRun")
}

tasks.register("runCommon") {
    dependsOn(":modules:common:bootRun")
}

tasks.register("runIdentity") {
    dependsOn(":modules:identity:bootRun")
}

tasks.register("runMedia") {
    dependsOn(":modules:media:bootRun")
}

tasks.register("runOcr") {
    dependsOn(":modules:ocr:bootRun")
}

tasks.register("runTimelogs") {
    dependsOn(":modules:timelogs:bootRun")
}

tasks.register("runWorkorders") {
    dependsOn(":modules:workorders:bootRun")
}

// Run both (use --parallel to actually run them simultaneously)
tasks.register("runAll") {
    dependsOn(
            ":apps:api:bootRun",
            ":modules:audit:bootRun",
            ":modules:billing:bootRun",
            ":modules:common:bootRun",
            ":modules:identity:bootRun",
            ":modules:media:bootRun",
            ":modules:ocr:bootRun",
            ":modules:timelogs:bootRun",
            ":modules:workorders:bootRun",
    )
}
// to execute all -  .\gradlew.bat  --parallel runAll

// Builds runnable jars for Boot apps + plain jars for libraries
tasks.register("packageAll") {
    dependsOn(
            ":apps:api:bootJar",
            ":modules:audit:jar",
            ":modules:billing:bootJar",
            ":modules:common:jar",
            ":modules:identity:bootJar",
            ":modules:media:bootJar",
            ":modules:ocr:bootJar",
            ":modules:timelogs:bootJar",
            ":modules:workorders:bootJar"
    )
}

// to generate .jar for  all - ./gradlew --parallel packageAll
