<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #snav mode="side" opened>
    <mat-toolbar color="primary">FieldWise</mat-toolbar>

    <mat-nav-list>
      <a mat-list-item routerLink="/users" routerLinkActive="active">Users</a>
      <a mat-list-item routerLink="/documents" routerLinkActive="active">Documents</a>
      <a mat-list-item routerLink="/realtime" routerLinkActive="active">Realtime</a>
      <a mat-list-item routerLink="/reports" routerLinkActive="active">Reports</a>
    </mat-nav-list>

    <mat-divider></mat-divider>

    <div class="px-3 py-2">
      <!-- Quick actions for your use case -->
      <button mat-stroked-button class="w-100" routerLink="/realtime">Clock In</button>
      <button mat-stroked-button class="w-100 mt-2" routerLink="/realtime">Clock Out</button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <!-- Forward projected content from layout -->
    <ng-content></ng-content>
  </mat-sidenav-content>
</mat-sidenav-container>
