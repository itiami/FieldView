<!-- Brand / mini-toolbar inside drawer -->
<div class="drawer-header">
  <div class="logo">
    <mat-icon>task_alt</mat-icon>
  </div>
  <div class="title">
    <div class="name">FieldWise</div>
    <div class="subtitle">Operations</div>
  </div>
</div>

<mat-divider></mat-divider>

<!-- Main navigation -->
<nav class="nav">
  <mat-nav-list>

    <!-- Top-level items -->
    <ng-container *ngFor="let item of menuTop">

      <!-- Case 1: item without children -> standard link -->
      <a
        *ngIf="!hasChildren(item)"
        mat-list-item
        [routerLink]="item.link!"
        [routerLinkActive]="'active'"
        [routerLinkActiveOptions]="{ exact: item.exact ?? true }"
        (click)="onNavigate()"
        aria-current="page"
      >
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.label }}</span>
        <span *ngIf="item.badge" matListItemMeta>
          <span matBadge="{{item.badge}}" matBadgeSize="small"></span>
        </span>
      </a>

      <!-- Case 2: item with children -> collapsible section button -->
      <div
        *ngIf="hasChildren(item)"
        class="section"
        [class.active]="isSectionActive(item)"
      >
        <button
          mat-list-item
          type="button"
          class="section-trigger"
          (click)="toggleSection(item.link)"
          (keydown.enter)="toggleSection(item.link)"
          (keydown.space)="toggleSection(item.link)"
          [attr.aria-expanded]="isExpanded(item)"
          [attr.aria-controls]="(item.link) + '-panel'"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
          <span class="chev" matListItemMeta [class.rotate]="isExpanded(item)">
            <mat-icon>expand_more</mat-icon>
          </span>
        </button>

        <!-- Children panel -->
        <div
          class="children"
          [id]="item.link + '-panel'"
          [class.open]="isExpanded(item)"
        >
          <a
            *ngFor="let child of item.children!"
            mat-list-item
            class="child"
            [routerLink]="child.link"
            [class.active]="isLinkActive(child.link, child.exact ?? true)"
            [routerLinkActive]="'active'"
            [routerLinkActiveOptions]="{ exact: child.exact ?? true }"
            (click)="onNavigate()"
          >
            <span class="dot" matListItemIcon></span>
            <span matListItemTitle>{{ child.label }}</span>
          </a>
        </div>
      </div>

    </ng-container>
  </mat-nav-list>
</nav>

<mat-divider></mat-divider>

<!-- Quick actions -->
<div class="quick-actions">
  <button
    mat-stroked-button
    class="w-100"
    [routerLink]="quickActions[0].link"
    (click)="onNavigate()"
    aria-label="Clock in"
  >
    <mat-icon>login</mat-icon>
    <span>Clock In</span>
  </button>

  <button
    mat-stroked-button
    class="w-100 mt-2"
    color="primary"
    [routerLink]="quickActions[1].link"
    (click)="onNavigate()"
    aria-label="Clock out"
  >
    <mat-icon>logout</mat-icon>
    <span>Clock Out</span>
  </button>
</div>

<!-- Footer area inside drawer (optional) -->
<div class="drawer-footer">
  <button mat-button routerLink="/settings" (click)="onNavigate()">
    <mat-icon>settings</mat-icon>
    Settings
  </button>
  <button mat-button routerLink="/help" (click)="onNavigate()">
    <mat-icon>help</mat-icon>
    Help
  </button>
</div>
