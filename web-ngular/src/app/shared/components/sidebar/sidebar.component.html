<!-- Brand / mini-toolbar inside drawer -->
<div class="drawer-header">
  <div class="logo">
    <mat-icon>task_alt</mat-icon>
  </div>
  <div class="title">
    <div class="name">FieldWise</div>
    <div class="subtitle">Operations</div>
  </div>
</div>

<mat-divider></mat-divider>

<!-- Main navigation -->
<nav class="nav">
  <mat-nav-list>
    <a
      mat-list-item
      *ngFor="let item of menuTop"
      [routerLink]="item.link"
      [routerLinkActive]="'active'"
     [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
      (click)="onNavigate()"
      aria-current="page"
    >
      <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
      <span matListItemTitle>{{ item.label }}</span>
      <span *ngIf="item.badge" matListItemMeta>
        <span matBadge="{{item.badge}}" matBadgeSize="small"></span>
      </span>
    </a>
  </mat-nav-list>
</nav>

<mat-divider></mat-divider>

<!-- Quick actions -->
<div class="quick-actions">
  <button
    mat-stroked-button
    class="w-100"
    [routerLink]="quickActions[0].link"
    (click)="onNavigate()"
    aria-label="Clock in"
  >
    <mat-icon>login</mat-icon>
    <span>Clock In</span>
  </button>

  <button
    mat-stroked-button
    class="w-100 mt-2"
    color="primary"
    [routerLink]="quickActions[1].link"
    (click)="onNavigate()"
    aria-label="Clock out"
  >
    <mat-icon>logout</mat-icon>
    <span>Clock Out</span>
  </button>
</div>

<!-- Footer area inside drawer (optional) -->
<div class="drawer-footer">
  <button mat-button routerLink="/settings" (click)="onNavigate()">
    <mat-icon>settings</mat-icon>
    Settings
  </button>
  <button mat-button routerLink="/help" (click)="onNavigate()">
    <mat-icon>help</mat-icon>
    Help
  </button>
</div>
